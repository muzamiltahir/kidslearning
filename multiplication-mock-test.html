<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Times Table Treasure Hunt</title>
  <style>
    :root { --ink:#213052; --purple:#6d4be8; --pink:#ff6b93; --yellow:#ffc940; --mint:#78dfba; --paper:#fffdf7; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; color:var(--ink); font-family:"Trebuchet MS", "Arial Rounded MT Bold", sans-serif; background:linear-gradient(135deg,#dff7ff 0%,#f1e7ff 52%,#fff2c8 100%); }
    .cloud { position:fixed; opacity:.55; border-radius:99px; background:white; z-index:-1; filter:drop-shadow(0 8px 8px #826ca22a); }
    .cloud:before,.cloud:after { content:""; position:absolute; border-radius:50%; background:white; }
    .cloud.one { width:135px;height:36px;top:8%;left:7%; }.cloud.two { width:155px;height:38px;top:20%;right:4%; }.cloud.three { width:110px;height:30px;bottom:7%;left:12%; }
    .cloud:before { width:55px;height:55px;left:20px;bottom:0; }.cloud:after { width:75px;height:75px;right:18px;bottom:0; }
    .wrap { width:min(950px,calc(100% - 28px)); margin:30px auto 48px; }
    header { text-align:center; position:relative; padding:18px 0 22px; }
    .badge { display:inline-block; padding:7px 14px; border-radius:30px; color:#5b3db9; background:#fff; box-shadow:0 5px 0 #d8c7ff; font-size:.9rem; font-weight:bold; letter-spacing:.04em; }
    h1 { margin:13px 0 6px; font-size:clamp(2.25rem,6vw,4rem); line-height:.95; color:#5939c6; text-shadow:3px 4px 0 #fff; }
    .subtitle { margin:0; font-size:1.08rem; font-weight:bold; color:#526080; }
    .star { position:absolute; color:var(--yellow); font-size:2.5rem; text-shadow:2px 3px 0 #d79c1c; }.star.a {left:7%; top:18px; transform:rotate(-18deg);}.star.b {right:9%;top:42px; transform:rotate(18deg);}
    .card { background:var(--paper); border:4px solid white; box-shadow:0 15px 0 #b8a1d852, 0 18px 26px #65719228; border-radius:28px; overflow:hidden; }
    .controls { display:grid; grid-template-columns:1.2fr .8fr; gap:22px; padding:24px; background:linear-gradient(90deg,#ffeff4,#fff9dd); border-bottom:2px dashed #e4d4c5; }
    .control-title { margin:0 0 11px; font-size:1rem; font-weight:900; }
    .tables { display:flex; gap:8px; flex-wrap:wrap; }
    .table-choice input { position:absolute; opacity:0; pointer-events:none; }
    .table-choice span { display:inline-flex; width:47px; height:42px; align-items:center; justify-content:center; border-radius:14px; background:white; border:2px solid #e2d8f8; box-shadow:0 3px 0 #d5c9ef; font-weight:900; cursor:pointer; transition:.16s; }
    .table-choice input:checked + span { transform:translateY(2px); color:white; background:var(--purple); border-color:var(--purple); box-shadow:0 1px 0 #4226ae; }
    .question-count { display:flex; gap:10px; }
    .question-count button { border:2px solid #d9d0ef; border-radius:14px; padding:10px 18px; background:white; color:var(--ink); font:900 1rem inherit; cursor:pointer; box-shadow:0 3px 0 #d5c9ef; }
    .question-count button.active { background:var(--pink); border-color:var(--pink); color:white; box-shadow:0 3px 0 #cc3862; }
    .test-area { padding:26px; }
    .test-top { display:flex; gap:14px; justify-content:space-between; align-items:center; margin-bottom:17px; }
    .test-top p { margin:0; font-weight:bold; }.tip { color:#755daa; font-size:.92rem; }
    .questions { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; }
    .question { position:relative; display:flex; align-items:center; min-height:84px; padding:13px 15px; border:2px solid #e7e0d1; background:#fff; border-radius:19px; }
    .question-number { display:grid; place-items:center; flex:none; width:31px;height:31px;margin-right:10px; border-radius:50%; color:#fff; background:#7f68d7; font-size:.82rem;font-weight:900; }
    .sum { flex:1; font-size:1.35rem; font-weight:900; white-space:nowrap; }
    .answer { width:70px; padding:10px 6px; border:2px solid #b8a9da; border-radius:12px; outline:none; color:#4b367e; text-align:center; font:900 1.16rem inherit; }
    .answer:focus { border-color:var(--purple); box-shadow:0 0 0 4px #e4dcff; }.question.correct { background:#edfff7; border-color:#6fd5a9; }.question.wrong { background:#fff2f4; border-color:#ff8ea9; }
    .mark { display:none; width:25px; margin-left:8px; font-size:1.4rem; font-weight:bold; }.correct .mark,.wrong .mark {display:block;}.correct .mark{color:#22ae73}.wrong .mark{color:#ed4c76}
    .actions { display:flex; gap:12px; justify-content:center; padding:5px 0 0; margin-top:25px; }
    button { font-family:inherit; }.primary,.secondary { border:0; border-radius:15px; padding:13px 20px; font-size:1rem; font-weight:900; cursor:pointer; transition:transform .15s; }.primary:hover,.secondary:hover{transform:translateY(-2px)}
    .primary { color:white; background:var(--purple); box-shadow:0 5px 0 #4125ac; }.secondary { color:#694c9f; background:#efe9ff; box-shadow:0 5px 0 #cfc1f4; }
    .result { display:none; margin:22px auto 0; max-width:560px; padding:16px; border-radius:18px; text-align:center; font-weight:bold; background:#fff6d9; color:#7a5611; }.result.show {display:block;}.result strong {font-size:1.27rem;}
    .footer-note { text-align:center; font-size:.86rem; color:#6b7490; margin:23px 0 0; }
    @media (max-width:620px) { .wrap{margin-top:15px}.controls,.questions {grid-template-columns:1fr}.controls{gap:18px}.test-area{padding:18px 14px}.test-top{align-items:flex-start;flex-direction:column}.actions{flex-direction:column}.primary,.secondary{width:100%}.star{display:none} }
  </style>
</head>
<body>
  <div class="cloud one"></div><div class="cloud two"></div><div class="cloud three"></div>
  <main class="wrap">
    <header><span class="star a">★</span><span class="star b">★</span><div class="badge">MATH ADVENTURE</div><h1>Times Table Treasure Hunt</h1><p class="subtitle">Choose your tables, solve the clues, and collect your score!</p></header>
    <section class="card">
      <div class="controls">
        <div><p class="control-title">1. Pick your multiplication tables</p><div class="tables" id="tables"></div></div>
        <div><p class="control-title">2. How many questions?</p><div class="question-count"><button class="active" data-count="5">5 questions</button><button data-count="10">10 questions</button></div></div>
      </div>
      <div class="test-area">
        <div class="test-top"><p>3. Solve the questions!</p><span class="tip">Type an answer, then check your work.</span></div>
        <div class="questions" id="questions"></div>
        <div class="actions"><button class="primary" id="check">Check my answers ✓</button><button class="secondary" id="newTest">↻ New questions</button></div>
        <div class="result" id="result" aria-live="polite"></div>
      </div>
    </section>
    <p class="footer-note">A new treasure hunt is ready whenever you are! ✨</p>
  </main>
  <script>
    const tableBox=document.querySelector('#tables'), questions=document.querySelector('#questions'), result=document.querySelector('#result');
    let count=5, quiz=[];
    for(let n=2;n<=12;n++){ const label=document.createElement('label'); label.className='table-choice'; label.innerHTML=`<input type="checkbox" value="${n}" ${n<=5?'checked':''}><span>×${n}</span>`; tableBox.append(label); }
    document.querySelectorAll('[data-count]').forEach(button=>button.onclick=()=>{ count=+button.dataset.count; document.querySelectorAll('[data-count]').forEach(b=>b.classList.toggle('active',b===button)); makeQuiz(); });
    function selected(){return [...tableBox.querySelectorAll('input:checked')].map(input=>+input.value)}
    function makeQuiz(){ const picks=selected(); if(!picks.length){alert('Please choose at least one table!'); return;} quiz=[]; let used=new Set(); while(quiz.length<count){let a=picks[Math.floor(Math.random()*picks.length)], b=2+Math.floor(Math.random()*11), key=`${a}x${b}`; if(used.size>=picks.length*11||!used.has(key)){used.add(key);quiz.push({a,b,answer:a*b});}} render(); }
    function render(){ result.classList.remove('show'); questions.innerHTML=quiz.map((q,i)=>`<div class="question"><span class="question-number">${i+1}</span><span class="sum">${q.a} × ${q.b} =</span><input class="answer" inputmode="numeric" aria-label="Answer for ${q.a} times ${q.b}"><span class="mark"></span></div>`).join(''); questions.querySelector('.answer')?.focus(); }
    document.querySelector('#check').onclick=()=>{let correct=0; [...questions.children].forEach((card,i)=>{const answer=card.querySelector('input'),mark=card.querySelector('.mark'), isCorrect=Number(answer.value)===quiz[i].answer && answer.value.trim()!==''; card.classList.toggle('correct',isCorrect);card.classList.toggle('wrong',!isCorrect);mark.textContent=isCorrect?'✓':'✕'; if(isCorrect)correct++;}); const cheer=correct===count?'Amazing work! You found every treasure! 🏆':correct>=Math.ceil(count*.7)?'Great job! You are getting super strong at tables! 🌟':'Keep practicing — every try makes your math muscles stronger! 💪'; result.innerHTML=`<strong>You got ${correct} out of ${count} correct!</strong><br>${cheer}`;result.classList.add('show');};
    document.querySelector('#newTest').onclick=makeQuiz; tableBox.addEventListener('change',makeQuiz); makeQuiz();
  </script>
</body>
</html>
