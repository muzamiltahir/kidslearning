<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Word Detective Academy</title>
  <style>
    :root{--ink:#223451;--navy:#304d87;--blue:#63c5ed;--yellow:#ffd95b;--coral:#ff7e79;--cream:#fffdf7;--green:#54c995}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(135deg,#dff6ff,#eee3ff 58%,#fff0bd);font-family:"Trebuchet MS","Arial Rounded MT Bold",sans-serif;color:var(--ink)}
    .wrap{width:min(850px,calc(100% - 28px));margin:32px auto 50px}header{text-align:center;position:relative;padding:6px 0 25px}.tag{display:inline-block;background:white;color:#4163a5;border-radius:999px;padding:7px 14px;font-size:.84rem;font-weight:900;letter-spacing:.07em;box-shadow:0 4px 0 #cadcf1}h1{margin:13px 0 7px;color:#2c5598;font-size:clamp(2.4rem,7vw,4.25rem);line-height:.92;text-shadow:3px 4px #fff}.subtitle{margin:0;font-weight:bold;color:#566681;font-size:1.07rem}.magnifier{position:absolute;right:8%;top:4px;font-size:3.1rem;transform:rotate(-14deg)}
    .card{overflow:hidden;background:var(--cream);border:4px solid #fff;border-radius:28px;box-shadow:0 15px 0 #7d71ad39,0 19px 28px #4551712b}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:0;background:#eef4ff;padding:10px 10px 0}.tab{border:0;border-radius:15px 15px 0 0;padding:13px 7px;background:transparent;color:#66738e;font:900 1rem inherit;cursor:pointer}.tab.active{background:var(--cream);color:#294f91}.lesson{padding:21px 28px;background:#e7f8ff;border-bottom:2px dashed #a8d7e8}.lesson h2{margin:0 0 7px;font-size:1.12rem;color:#2d6594}.lesson p{margin:0;line-height:1.5}.word-example{display:inline-block;margin:0 2px;padding:0 5px;border-radius:5px;background:#ffe28b;color:#875907;font-weight:900}
    .game{padding:26px 28px}.progress{display:flex;align-items:center;gap:13px;margin-bottom:22px;font-weight:900}.dots{display:flex;gap:6px}.dot{width:13px;height:13px;border-radius:50%;background:#e3ddeb}.dot.done{background:var(--green)}.dot.now{background:var(--yellow);box-shadow:0 0 0 3px #fff0ac}.sentence-card{padding:25px;border:2px solid #d9e3ea;border-radius:22px;background:#fff;box-shadow:0 4px 0 #e7eef1}.instruction{margin:0 0 15px;color:#6c7792;font-weight:bold}.sentence{font-size:clamp(1.45rem,4vw,2rem);line-height:1.6;font-weight:900}.word{border:0;background:transparent;color:inherit;padding:2px 5px;margin:1px;border-radius:8px;font:inherit;cursor:pointer;transition:.16s}.word:hover{background:#e9f6fb}.word.selected{background:#ffd95b;color:#614300;box-shadow:inset 0 -3px #e3ad1b}.word.correct{background:#bff1d6;color:#176b48}.word.missed,.word.incorrect{background:#ffd1d4;color:#a42c44}.helper{margin:18px 0 0;color:#65718b;font-size:.92rem;font-weight:bold}.actions{display:flex;justify-content:space-between;gap:12px;margin-top:25px}.button{border:0;border-radius:14px;padding:12px 18px;cursor:pointer;font:900 1rem inherit;transition:.15s}.button:hover{transform:translateY(-2px)}.check{color:#fff;background:#355d9e;box-shadow:0 5px 0 #183f7b}.next{color:#fff;background:var(--coral);box-shadow:0 5px 0 #cf4c5b}.next:disabled{background:#d9dce5;box-shadow:none;cursor:not-allowed}.reset{color:#355d9e;background:#e5f2ff;box-shadow:0 5px 0 #c4ddeb}.feedback{display:none;margin-top:20px;border-radius:16px;padding:15px;text-align:center;font-weight:bold;line-height:1.45}.feedback.show{display:block}.feedback.good{background:#e3faed;color:#16724b}.feedback.try{background:#fff2d4;color:#906110}.final{display:none;text-align:center;padding:13px 0 0}.final.show{display:block}.final h2{margin:4px 0 8px;color:#2d609c}.final p{font-weight:bold;margin:0 0 19px}@media(max-width:560px){.wrap{margin-top:18px}.magnifier{display:none}.lesson,.game{padding:20px 16px}.actions{flex-wrap:wrap}.check{flex:1}.next{flex:1}.reset{width:100%}}
  </style>
</head>
<body>
  <main class="wrap">
    <header><div class="magnifier">🔎</div><span class="tag">WORD DETECTIVE ACADEMY</span><h1>Word Detective</h1><p class="subtitle">Learn to spot nouns, verbs, and adjectives!</p></header>
    <section class="card">
      <nav class="tabs" aria-label="Word detective sections"><button class="tab active" data-type="noun">Nouns</button><button class="tab" data-type="verb">Verbs</button><button class="tab" data-type="adjective">Adjectives</button></nav>
      <div class="lesson" id="lesson"></div>
      <div class="game" id="game">
        <div class="progress"><span id="step">Clue 1 of 5</span><div class="dots" id="dots"></div></div>
        <div class="sentence-card"><p class="instruction" id="instruction"></p><div class="sentence" id="sentence"></div><p class="helper" id="helper">Tip: There may be more than one answer!</p></div>
        <div class="actions"><button class="button check" id="check">Check my answer ✓</button><button class="button next" id="next" disabled>Next clue →</button></div>
        <div class="feedback" id="feedback" aria-live="polite"></div>
        <div class="final" id="final"><h2>Case closed! 🕵️‍♀️</h2><p id="finalMessage"></p><button class="button reset" id="again">Play again ↻</button></div>
      </div>
    </section>
  </main>
  <script>
    const games={
      noun:{name:'noun',title:'What is a noun?',lesson:'A <b>noun</b> is a naming word. It can name a <span class="word-example">person</span>, <span class="word-example">place</span>, <span class="word-example">animal</span>, or <span class="word-example">thing</span>.',clues:[
        {words:['The','cat','sleeps','on','the','sofa','.'],answers:[1,5],hint:'Cat is an animal and sofa is a thing.'},{words:['Maya','takes','her','lunchbox','to','school','.'],answers:[0,3,5],hint:'Maya is a person, and a lunchbox and school are names too.'},{words:['The','happy','dog','chased','a','ball','.'],answers:[2,5],hint:'Dog is an animal, and ball is a thing.'},{words:['We','visited','the','museum','on','Saturday','.'],answers:[3,5],hint:'A museum is a place, and Saturday is the name of a day.'},{words:['Dad','read','a','book','in','the','garden','.'],answers:[0,3,6],hint:'Dad is a person; a book and garden are things or places.'}]},
      verb:{name:'verb',title:'What is a verb?',lesson:'A <b>verb</b> is an action or doing word. It tells what someone or something <span class="word-example">does</span>.',clues:[
        {words:['The','baby','laughs','loudly','.'],answers:[2],hint:'Laughs tells what the baby does.'},{words:['Birds','fly','across','the','sky','.'],answers:[1],hint:'Fly is the action word.'},{words:['Sam','and','I','paint','a','picture','.'],answers:[3],hint:'Paint tells the action Sam and I do.'},{words:['The','rabbit','hopped','over','the','log','.'],answers:[2],hint:'Hopped is the action word.'},{words:['My','brother','will','kick','the','ball','.'],answers:[3],hint:'Kick tells what your brother will do.'}]},
      adjective:{name:'adjective',title:'What is an adjective?',lesson:'An <b>adjective</b> is a describing word. It tells us more about a noun, such as <span class="word-example">what kind</span>, <span class="word-example">how many</span>, or <span class="word-example">which one</span>.',clues:[
        {words:['The','tiny','mouse','ate','cheese','.'],answers:[1],hint:'Tiny describes what kind of mouse it is.'},{words:['I','found','three','shiny','shells','.'],answers:[2,3],hint:'Three tells how many shells and shiny describes them.'},{words:['A','rainy','day','kept','us','inside','.'],answers:[1],hint:'Rainy describes the day.'},{words:['The','tall','giraffe','eats','leaves','.'],answers:[1],hint:'Tall describes the giraffe.'},{words:['She','wore','a','purple','hat','to','the','party','.'],answers:[3],hint:'Purple describes the hat.'}]}
    };
    let type='noun',position=0,score=0,checked=false;const sentence=document.querySelector('#sentence'),feedback=document.querySelector('#feedback'),check=document.querySelector('#check'),next=document.querySelector('#next'),dots=document.querySelector('#dots');
    function game(){return games[type]} function resetGame(){position=0;score=0;document.querySelector('.sentence-card').style.display='block';document.querySelector('.actions').style.display='flex';document.querySelector('#step').style.display='inline';dots.style.display='flex';document.querySelector('#final').classList.remove('show');document.querySelector('#lesson').innerHTML=`<h2>${game().title}</h2><p>${game().lesson}</p>`;document.querySelector('#instruction').textContent=`Tap every ${game().name} in this sentence:`;render()}
    function render(){checked=false;feedback.className='feedback';check.style.display='inline-block';next.disabled=true;document.querySelector('#step').textContent=`Clue ${position+1} of ${game().clues.length}`;dots.innerHTML=game().clues.map((_,i)=>`<span class="dot ${i<position?'done':i===position?'now':''}"></span>`).join('');sentence.innerHTML=game().clues[position].words.map((word,i)=>`<button class="word" data-index="${i}">${word}</button>`).join(' ');sentence.querySelectorAll('.word').forEach(w=>w.onclick=()=>{if(!checked)w.classList.toggle('selected')});}
    function grade(){if(checked)return;checked=true;const clue=game().clues[position],picked=[...sentence.querySelectorAll('.selected')].map(w=>+w.dataset.index),right=clue.answers,exact=picked.length===right.length&&picked.every(x=>right.includes(x));sentence.querySelectorAll('.word').forEach(word=>{const i=+word.dataset.index;if(right.includes(i))word.classList.add('correct');else if(picked.includes(i))word.classList.add('incorrect')});if(exact){score++;feedback.innerHTML=`Excellent detective work! You found every ${game().name}! 🌟`;feedback.className='feedback show good'}else{feedback.innerHTML=`Nice try! The ${game().name}s are highlighted in green. ${clue.hint}`;feedback.className='feedback show try'}check.style.display='none';next.disabled=false;next.textContent=position===game().clues.length-1?'See my score →':'Next clue →'}
    check.onclick=grade;next.onclick=()=>{if(position<game().clues.length-1){position++;render()}else{document.querySelector('.sentence-card').style.display='none';document.querySelector('.actions').style.display='none';feedback.style.display='none';document.querySelector('#step').style.display='none';dots.style.display='none';document.querySelector('#finalMessage').textContent=`You solved ${score} out of ${game().clues.length} ${game().name} clues correctly. ${score===game().clues.length?'You are a super word detective!':'Keep practising — you are learning fast!'}`;document.querySelector('#final').classList.add('show')}};document.querySelector('#again').onclick=resetGame;document.querySelectorAll('.tab').forEach(tab=>tab.onclick=()=>{type=tab.dataset.type;document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t===tab));resetGame()});resetGame();
  </script>
</body>
</html>
