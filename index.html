<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Phonics Learning</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Segoe UI", Arial, sans-serif;
            background: linear-gradient(135deg, #f5f7ff, #eef8ff);
            color: #263238;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 15px;
        }

        .container {
            width: 100%;
            max-width: 900px;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo {
            width: 72px;
            height: 72px;
            margin: 0 auto 18px;
            border-radius: 20px;
            background: #4f46e5;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 34px;
            font-weight: 700;
            box-shadow: 0 10px 25px rgba(79, 70, 229, 0.25);
        }

        h1 {
            margin: 0;
            font-size: 36px;
            font-weight: 700;
            color: #1e293b;
        }

        .subtitle {
            margin: 10px 0 0;
            color: #64748b;
            font-size: 17px;
        }

        /* Cards */
        .cards {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 24px;
        }

        .card {
            text-decoration: none;
            color: inherit;
            background: white;
            border-radius: 20px;
            padding: 30px;
            display: flex;
            align-items: center;
            gap: 22px;
            border: 1px solid #e5e7eb;
            box-shadow: 0 8px 25px rgba(15, 23, 42, 0.07);
            transition: transform 0.2s ease,
                        box-shadow 0.2s ease,
                        border-color 0.2s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(15, 23, 42, 0.12);
            border-color: #c7d2fe;
        }

        .card-icon {
            width: 64px;
            height: 64px;
            flex-shrink: 0;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
        }

        .phonics-icon {
            background: #ede9fe;
        }

        .sight-icon {
            background: #dcfce7;
        }

        .card-content {
            flex: 1;
        }

        .card-title {
            margin: 0 0 7px;
            font-size: 20px;
            font-weight: 650;
            color: #1e293b;
        }

        .card-description {
            margin: 0;
            color: #64748b;
            font-size: 14px;
            line-height: 1.5;
        }

        .arrow {
            font-size: 24px;
            color: #94a3b8;
            transition: transform 0.2s ease;
        }

        .card:hover .arrow {
            transform: translateX(5px);
            color: #4f46e5;
        }

        /* Footer */
        .footer {
            text-align: center;
            margin-top: 40px;
            color: #94a3b8;
            font-size: 13px;
        }

        /* Mobile */
        @media (max-width: 650px) {
            body {
                padding: 25px 15px;
            }

            h1 {
                font-size: 30px;
            }

            .subtitle {
                font-size: 15px;
            }

            .cards {
                grid-template-columns: 1fr;
            }

            .card {
                padding: 24px;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <header class="header">
            <div class="logo">Aa</div>

            <h1>Phonics Learning</h1>

            <p class="subtitle">
                Build reading skills, one word at a time.
            </p>
        </header>


        <section class="cards">

            <a class="card" href="Phonics Word Lists.html">

                <div class="card-icon phonics-icon">
                    🔤
                </div>

                <div class="card-content">
                    <h2 class="card-title">Phonics Word Lists</h2>

                    <p class="card-description">
                        Practice words grouped by phonics sounds and patterns.
                    </p>
                </div>

                <div class="arrow">→</div>

            </a>


            <a class="card" href="500 Sight Words.html">

                <div class="card-icon sight-icon">
                    📖
                </div>

                <div class="card-content">
                    <h2 class="card-title">500 Sight Words</h2>

                    <p class="card-description">
                        Learn and practice the most commonly used sight words.
                    </p>
                </div>

                <div class="arrow">→</div>

            </a>

        </section>


        <footer class="footer">
            Phonics Learning • Reading Practice
        </footer>

    </main>

</body>
</html>
