<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Interactive phonics word lists with saved learning progress.">
  <title>Phonics Word Lists</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">

  <style>
:root {
  --bg: #F8F5F0;
  --surface: #FFFFFF;
  --ink: #1C1810;
  --muted: #7A7060;
  --border: #E2D9CF;

  --c1: #1B6B3A; --c1-bg: #E6F4EC; --c1-pill: #C3E6D0;
  --c2: #1A4E8C; --c2-bg: #E4EDF8; --c2-pill: #BAD0EF;
  --c3: #7B2B8B; --c3-bg: #F3E8F6; --c3-pill: #DDB8E8;
  --c4: #C04A10; --c4-bg: #FAEDE5; --c4-pill: #F2C3A8;
  --c5: #5C7A1A; --c5-bg: #EEF5E0; --c5-pill: #CCDF9A;
  --c6: #8B3A1A; --c6-bg: #F6EBE4; --c6-pill: #E8BFAA;
  --c7: #1A6E7A; --c7-bg: #E3F4F6; --c7-pill: #A8DCE3;
  --c8: #5A5A5A; --c8-bg: #EFEFEF; --c8-pill: #D0D0D0;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  color: var(--ink);
  padding: 2rem 1.5rem 4rem;
  max-width: 1100px;
  margin: 0 auto;
}

h1 {
  font-family: 'Fraunces', serif;
  font-size: clamp(2rem, 5vw, 3rem);
  font-weight: 700;
  letter-spacing: -0.02em;
  margin-bottom: 0.25rem;
}

.subtitle {
  color: var(--muted);
  font-size: 15px;
  margin-bottom: 2.5rem;
}

/* NAV */
.nav-pills {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 2.5rem;
  position: sticky;
  top: 0;
  z-index: 20;
  background: var(--bg);
  padding: 10px 0;
  border-bottom: 1px solid var(--border);
}

.nav-pill {
  padding: 6px 14px;
  border-radius: 20px;
  border: 1.5px solid var(--border);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  background: var(--surface);
  color: var(--muted);
  text-decoration: none;
  transition: all 0.15s;
}
.nav-pill:hover { border-color: var(--ink); color: var(--ink); }

/* SECTION */
.section { margin-bottom: 3.5rem; scroll-margin-top: 70px; }

.section-header {
  display: flex;
  align-items: baseline;
  gap: 14px;
  margin-bottom: 1.25rem;
  padding-bottom: 0.75rem;
  border-bottom: 2px solid var(--ink);
}

.section-number {
  font-family: 'Fraunces', serif;
  font-size: 1.8rem;
  font-weight: 700;
  color: var(--border);
  line-height: 1;
}

.section-title {
  font-family: 'Fraunces', serif;
  font-size: 1.5rem;
  font-weight: 700;
  line-height: 1;
}

.section-desc {
  font-size: 13px;
  color: var(--muted);
  margin-left: auto;
}

/* GROUP WIDGET */
.group-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 12px;
}

.group-widget {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  overflow: hidden;
}

.group-header {
  padding: 10px 14px 9px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--border);
}

.group-label {
  font-family: 'Fraunces', serif;
  font-size: 1rem;
  font-weight: 700;
}

.group-count {
  font-size: 11px;
  font-weight: 600;
  padding: 2px 8px;
  border-radius: 10px;
}

.word-wrap {
  padding: 10px 12px;
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.word-pill {
  padding: 4px 10px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: opacity 0.12s, transform 0.1s;
  user-select: none;
}
.word-pill:hover { opacity: 0.75; transform: scale(1.05); }
.word-pill.learned { opacity: 0.35; text-decoration: line-through; }

/* CVC special — flat word grid */
.cvc-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(72px, 1fr));
  gap: 8px;
}

.cvc-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 8px 4px;
  text-align: center;
  cursor: pointer;
  font-family: 'Fraunces', serif;
  font-size: 1rem;
  font-weight: 600;
  transition: all 0.12s;
}
.cvc-card:hover { transform: translateY(-2px); box-shadow: 0 4px 10px rgba(0,0,0,0.07); }
.cvc-card.learned { opacity: 0.35; text-decoration: line-through; }

.vowel-tag {
  display: block;
  font-family: 'DM Sans', sans-serif;
  font-size: 10px;
  font-weight: 500;
  color: var(--muted);
  margin-top: 2px;
}

/* PROGRESS BAR */
.prog-wrap { margin-bottom: 1rem; }
.prog-label { font-size: 13px; color: var(--muted); margin-bottom: 4px; display: flex; justify-content: space-between; }
.prog-track { height: 4px; background: var(--border); border-radius: 4px; overflow: hidden; }
.prog-fill { height: 100%; border-radius: 4px; transition: width 0.3s; }

/* COLOR THEMES per section */
.s1 .section-title { color: var(--c1); }
.s1 .group-header { background: var(--c1-bg); }
.s1 .group-label { color: var(--c1); }
.s1 .group-count { background: var(--c1-pill); color: var(--c1); }
.s1 .word-pill { background: var(--c1-bg); color: var(--c1); }
.s1 .cvc-card { color: var(--c1); }
.s1 .prog-fill { background: var(--c1); }

.s2 .section-title { color: var(--c2); }
.s2 .group-header { background: var(--c2-bg); }
.s2 .group-label { color: var(--c2); }
.s2 .group-count { background: var(--c2-pill); color: var(--c2); }
.s2 .word-pill { background: var(--c2-bg); color: var(--c2); }
.s2 .prog-fill { background: var(--c2); }

.s3 .section-title { color: var(--c3); }
.s3 .group-header { background: var(--c3-bg); }
.s3 .group-label { color: var(--c3); }
.s3 .group-count { background: var(--c3-pill); color: var(--c3); }
.s3 .word-pill { background: var(--c3-bg); color: var(--c3); }
.s3 .prog-fill { background: var(--c3); }

.s4 .section-title { color: var(--c4); }
.s4 .group-header { background: var(--c4-bg); }
.s4 .group-label { color: var(--c4); }
.s4 .group-count { background: var(--c4-pill); color: var(--c4); }
.s4 .word-pill { background: var(--c4-bg); color: var(--c4); }
.s4 .prog-fill { background: var(--c4); }

.s5 .section-title { color: var(--c5); }
.s5 .group-header { background: var(--c5-bg); }
.s5 .group-label { color: var(--c5); }
.s5 .group-count { background: var(--c5-pill); color: var(--c5); }
.s5 .word-pill { background: var(--c5-bg); color: var(--c5); }
.s5 .prog-fill { background: var(--c5); }

.s6 .section-title { color: var(--c6); }
.s6 .group-header { background: var(--c6-bg); }
.s6 .group-label { color: var(--c6); }
.s6 .group-count { background: var(--c6-pill); color: var(--c6); }
.s6 .word-pill { background: var(--c6-bg); color: var(--c6); }
.s6 .prog-fill { background: var(--c6); }

.s7 .section-title { color: var(--c7); }
.s7 .group-header { background: var(--c7-bg); }
.s7 .group-label { color: var(--c7); }
.s7 .group-count { background: var(--c7-pill); color: var(--c7); }
.s7 .word-pill { background: var(--c7-bg); color: var(--c7); }
.s7 .prog-fill { background: var(--c7); }

.s8 .section-title { color: var(--c8); }
.s8 .group-header { background: var(--c8-bg); }
.s8 .group-label { color: var(--c8); }
.s8 .group-count { background: var(--c8-pill); color: var(--c8); }
.s8 .word-pill { background: var(--c8-bg); color: var(--c8); }
.s8 .prog-fill { background: var(--c8); }

footer { text-align: center; color: var(--muted); font-size: 13px; margin-top: 3rem; }
    html {
      scroll-behavior: smooth;
    }

    .subgroup-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      margin: 0 0 8px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .nav-actions {
      display: flex;
      gap: 8px;
      margin-left: auto;
    }

    .reset-button {
      padding: 6px 14px;
      border-radius: 20px;
      border: 1.5px solid var(--border);
      font: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      background: var(--surface);
      color: var(--muted);
      transition: all 0.15s;
    }

    .reset-button:hover {
      border-color: #b33;
      color: #b33;
    }

    .word-pill:focus-visible,
    .cvc-card:focus-visible,
    .nav-pill:focus-visible,
    .reset-button:focus-visible {
      outline: 3px solid currentColor;
      outline-offset: 2px;
    }

    .prog-track {
      position: relative;
    }

    @media (max-width: 700px) {
      body {
        padding: 1.25rem 1rem 3rem;
      }

      .nav-pills {
        gap: 6px;
      }

      .nav-pill,
      .reset-button {
        padding: 6px 10px;
      }

      .section-header {
        align-items: flex-start;
        flex-wrap: wrap;
      }

      .section-desc {
        flex-basis: 100%;
        margin-left: 0;
      }

      .nav-actions {
        margin-left: 0;
        width: 100%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      *, *::before, *::after {
        transition: none !important;
      }
    }
  </style>
</head>

      { label: 'ow (ow sound)', words: ['bow','brow','clown','cow','crowd','down','frown','gown','how','now'] },
      { label: 'ow (long O)', words: ['blow','flow','glow','grow','know','low','row','show','slow','snow'] },
      { label: 'ew', words: ['blew','brew','chew','crew','dew','flew','grew','new','stew','threw'] },
      { label: 'au', words: ['applaud','August','auto','cause','clause','fault','haul','launch','pause','sauce'] },
      { label: 'aw', words: ['claw','crawl','dawn','draw','fawn','jaw','law','paw','raw','saw'] },
    ]
  },
  {
    id: 8, cls: 's8', anchor: 's8',
    title: 'Silent Letters',
    desc: 'Letters you write but don\'t say',
    type: 'group',
    groups: [
      { label: 'silent b', words: ['bomb','climb','comb','crumb','debt','doubt','dumb','lamb','limb','thumb'] },
      { label: 'silent c', words: ['acquire','black','muscle','obscene','scissors','scene','scent','scenic','science','sceptic'] },
      { label: 'silent d', words: ['adjust','edge','handsome','hedge','judge','ledge','lodge','sandwich','sledge','Wednesday'] },
      { label: 'silent e', words: ['bake','blue','come','give','have','home','live','love','some','time'] },
      { label: 'silent g', words: ['align','campaign','design','foreign','gnash','gnarl','gnome','gnu','resign','sign'] },
      { label: 'silent gh', words: ['bright','daughter','fight','flight','fright','light','might','night','right','tight'] },
      { label: 'silent h', words: ['ghost','heir','honest','honor','hour','rhyme','rhythm','vehicle','what','white'] },
      { label: 'silent k', words: ['knack','knee','kneel','knew','knife','knight','knit','knob','knock','know'] },
      { label: 'silent l', words: ['calm','calf','chalk','could','folk','half','palm','psalm','talk','walk'] },
      { label: 'silent n', words: ['autumn','column','condemn','damn','hymn','solemn','government','environment','damn','contemn'] },
      { label: 'silent p', words: ['pneumonia','psalm','psyche','psychology','pterodactyl','receipt','corps','pneumatic','raspberry','cupboard'] },
      { label: 'silent t', words: ['ballet','buffet','castle','Christmas','fasten','glisten','hustle','listen','often','whistle'] },
      { label: 'silent w', words: ['answer','awry','playwright','sword','two','who','whole','wrap','wren','write'] },
    ]
  }
];


let learned = {};
try {
  learned = JSON.parse(localStorage.getItem('phonics_learned2') || '{}');
  if (!learned || typeof learned !== 'object') learned = {};
} catch {
  learned = {};
}

function save() {
  try {
    localStorage.setItem('phonics_learned2', JSON.stringify(learned));
  } catch (err) {
    console.warn('Could not save progress:', err);
  }
}

function wordKey(sectionId, groupLabel, word) {
  return `${sectionId}::${groupLabel}::${word}`;
}

function isLearned(sectionId, groupLabel, word) {
  return !!learned[wordKey(sectionId, groupLabel, word)];
}

function toggleWord(sectionId, groupLabel, word, element) {
  const key = wordKey(sectionId, groupLabel, word);
  learned[key] = !learned[key];

  element.classList.toggle('learned', learned[key]);
  element.setAttribute('aria-pressed', String(!!learned[key]));

  save();
  updateSectionProgress(sectionId);
}

function updateSectionProgress(sectionId) {
  const section = DATA.find(item => item.id === sectionId);
  if (!section) return;

  const allWords = section.groups.flatMap(group => group.words);
  const done = section.groups.reduce((count, group) => {
    return count + group.words.filter(word => isLearned(section.id, group.label, word)).length;
  }, 0);

  const fill = document.getElementById(`prog-${section.id}`);
  const label = document.getElementById(`proglbl-${section.id}`);

  if (fill) {
    fill.style.width = allWords.length ? `${(done / allWords.length * 100).toFixed(1)}%` : '0%';
  }

  if (label) {
    label.textContent = `${done} / ${allWords.length} learned`;
  }
}

function updateAllProgress() {
  DATA.forEach(section => updateSectionProgress(section.id));
}

function makeInteractive(element, sectionId, groupLabel, word) {
  element.setAttribute('role', 'button');
  element.setAttribute('tabindex', '0');
  element.setAttribute('aria-pressed', String(isLearned(sectionId, groupLabel, word)));

  const activate = () => toggleWord(sectionId, groupLabel, word, element);

  element.addEventListener('click', activate);
  element.addEventListener('keydown', event => {
    if (event.key === 'Enter' || event.key === ' ') {
      event.preventDefault();
      activate();
    }
  });
}

function buildCVC(section) {
  const container = document.createElement('div');

  section.groups.forEach(group => {
    const title = document.createElement('p');
    title.className = 'subgroup-title';
    title.textContent = group.label;
    container.appendChild(title);

    const grid = document.createElement('div');
    grid.className = 'cvc-grid';
    grid.style.marginBottom = '1.25rem';

    group.words.forEach(word => {
      const card = document.createElement('div');
      card.className = 'cvc-card' + (isLearned(section.id, group.label, word) ? ' learned' : '');

      const wordText = document.createElement('span');
      wordText.textContent = word;

      const vowel = document.createElement('span');
      vowel.className = 'vowel-tag';
      vowel.textContent = word.length > 1 ? word[1] : '';

      card.append(wordText, vowel);
      makeInteractive(card, section.id, group.label, word);
      grid.appendChild(card);
    });

    container.appendChild(grid);
  });

  return container;
}

function buildGroups(section) {
  const grid = document.createElement('div');
  grid.className = 'group-grid';

  section.groups.forEach(group => {
    const widget = document.createElement('div');
    widget.className = 'group-widget';

    const header = document.createElement('div');
    header.className = 'group-header';

    const label = document.createElement('span');
    label.className = 'group-label';
    label.textContent = group.label;

    const count = document.createElement('span');
    count.className = 'group-count';
    count.textContent = group.words.length;

    header.append(label, count);
    widget.appendChild(header);

    const wordWrap = document.createElement('div');
    wordWrap.className = 'word-wrap';

    group.words.forEach(word => {
      const pill = document.createElement('span');
      pill.className = 'word-pill' + (isLearned(section.id, group.label, word) ? ' learned' : '');
      pill.textContent = word;
      makeInteractive(pill, section.id, group.label, word);
      wordWrap.appendChild(pill);
    });

    widget.appendChild(wordWrap);
    grid.appendChild(widget);
  });

  return grid;
}

function render() {
  const app = document.getElementById('app');
  app.replaceChildren();

  DATA.forEach(section => {
    const allWords = section.groups.flatMap(group => group.words);

    const sec = document.createElement('section');
    sec.className = `section ${section.cls}`;
    sec.id = section.anchor;
    sec.setAttribute('aria-labelledby', `title-${section.id}`);

    const header = document.createElement('div');
    header.className = 'section-header';

    const number = document.createElement('span');
    number.className = 'section-number';
    number.textContent = String(section.id).padStart(2, '0');

    const title = document.createElement('h2');
    title.className = 'section-title';
    title.id = `title-${section.id}`;
    title.textContent = section.title;

    const desc = document.createElement('span');
    desc.className = 'section-desc';
    desc.textContent = section.desc;

    header.append(number, title, desc);
    sec.appendChild(header);

    const progress = document.createElement('div');
    progress.className = 'prog-wrap';

    const progressLabel = document.createElement('div');
    progressLabel.className = 'prog-label';

    const progressText = document.createElement('span');
    progressText.textContent = 'Progress';

    const progressCount = document.createElement('span');
    progressCount.id = `proglbl-${section.id}`;

    progressLabel.append(progressText, progressCount);

    const track = document.createElement('div');
    track.className = 'prog-track';
    track.setAttribute('role', 'progressbar');
    track.setAttribute('aria-label', `${section.title} progress`);
    track.setAttribute('aria-valuemin', '0');
    track.setAttribute('aria-valuemax', String(allWords.length));

    const fill = document.createElement('div');
    fill.className = 'prog-fill';
    fill.id = `prog-${section.id}`;

    track.appendChild(fill);
    progress.append(progressLabel, track);
    sec.appendChild(progress);

    const content = section.type === 'cvc'
      ? buildCVC(section)
      : buildGroups(section);

    sec.appendChild(content);
    app.appendChild(sec);
  });

  updateAllProgress();
}

function resetProgress() {
  if (!confirm('Reset all phonics progress? This cannot be undone.')) return;
  learned = {};
  save();

  document.querySelectorAll('.learned').forEach(element => {
    element.classList.remove('learned');
    element.setAttribute('aria-pressed', 'false');
  });

  updateAllProgress();
}

document.addEventListener('DOMContentLoaded', () => {
  render();

  const resetButton = document.getElementById('reset-progress');
  resetButton.addEventListener('click', resetProgress);
});

  </script>
