<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skip Count Adventure</title>
<style>
  :root {
    --ink:#263238;
    --blue:#4dabf7;
    --green:#51cf66;
    --red:#ff6b6b;
    --yellow:#ffd43b;
    --purple:#845ef7;
    --bg:#f6f8ff;
    --card:#ffffff;
  }
  * { box-sizing:border-box; }
  body {
    margin:0;
    font-family: "Trebuchet MS", Arial, sans-serif;
    color:var(--ink);
    background:
      radial-gradient(circle at 10% 10%, #fff3bf 0 8%, transparent 9%),
      radial-gradient(circle at 90% 15%, #d0ebff 0 9%, transparent 10%),
      linear-gradient(135deg,#f8f9ff,#eef7ff);
    min-height:100vh;
  }
  .wrap { max-width:1100px; margin:auto; padding:20px; }
  header { text-align:center; margin-bottom:18px; }
  h1 { margin:5px 0 4px; font-size:clamp(2rem,6vw,3.5rem); color:#5f3dc4; }
  .subtitle { margin:0; font-size:1.08rem; }
  .panel {
    background:var(--card);
    border-radius:24px;
    padding:20px;
    box-shadow:0 10px 30px rgba(55,65,81,.10);
    margin-bottom:18px;
  }
  .setup {
    display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:10px;
  }
  label { font-size:1.1rem; font-weight:800; }
  select, button {
    font:inherit; font-weight:800; border:0; border-radius:14px;
    cursor:pointer; touch-action:manipulation;
  }
  select {
    padding:12px 18px; background:#edf2ff; color:#364fc7;
    border:2px solid #bac8ff;
  }
  .start {
    padding:13px 22px; color:white; background:#845ef7;
    box-shadow:0 5px 0 #6741d9;
  }
  .start:active { transform:translateY(3px); box-shadow:0 2px 0 #6741d9; }
  .status {
    display:grid; grid-template-columns:repeat(3,1fr); gap:10px;
    margin-top:16px;
  }
  .stat {
    text-align:center; padding:10px; border-radius:16px; background:#f8f9fa;
  }
  .stat strong { display:block; font-size:1.35rem; }
  .hint {
    text-align:center; min-height:44px; margin-top:14px;
    font-size:1.15rem; font-weight:800;
  }
  .progress-wrap {
    height:15px; background:#e9ecef; border-radius:99px; overflow:hidden; margin-top:10px;
  }
  .progress {
    height:100%; width:0; background:linear-gradient(90deg,#74c0fc,#51cf66);
    transition:width .25s ease;
  }
  .board {
    display:grid;
    grid-template-columns:repeat(10,1fr);
    gap:7px;
  }
  .num {
    aspect-ratio:1;
    min-width:0;
    border:2px solid #dbe4ff;
    background:#fff;
    color:#364fc7;
    font-size:clamp(.82rem,2.2vw,1.15rem);
    font-weight:900;
    border-radius:13px;
    box-shadow:0 3px 0 #d9e2ff;
    transition:transform .12s, background .18s, color .18s, border .18s;
  }
  .num:hover { transform:translateY(-2px); }
  .num:active { transform:scale(.94); }
  .num.correct {
    background:var(--green); color:white; border-color:#2f9e44; box-shadow:0 3px 0 #2f9e44;
    animation:pop .25s ease;
  }
  .num.wrong {
    background:var(--red); color:white; border-color:#e03131;
    animation:shake .3s ease;
  }
  .num.done { opacity:.75; }
  .num.locked { cursor:default; }
  .legend { display:flex; justify-content:center; gap:18px; margin-top:14px; font-weight:800; }
  .dot { display:inline-block; width:15px; height:15px; border-radius:50%; vertical-align:-2px; margin-right:5px; }
  .green { background:var(--green); } .red { background:var(--red); }
  .connection {
    display:none; text-align:center; margin-top:18px;
    background:#fff9db; border:3px dashed #fcc419; border-radius:20px; padding:16px;
  }
  .connection.show { display:block; animation:pop .3s ease; }
  .equation { font-size:clamp(1.3rem,4vw,2rem); font-weight:900; color:#5f3dc4; }
  .message { font-size:1.15rem; font-weight:800; margin-top:6px; }
  .small { text-align:center; color:#6c757d; margin:10px 0 0; font-size:.9rem; }

  @keyframes pop { 50% { transform:scale(1.12); } }
  @keyframes shake {
    25%{transform:translateX(-5px)} 50%{transform:translateX(5px)}
    75%{transform:translateX(-4px)}
  }
  @media (max-width:650px) {
    .wrap { padding:10px; }
    .panel { padding:13px; border-radius:18px; }
    .board { gap:4px; }
    .num { border-radius:8px; border-width:1px; box-shadow:0 2px 0 #d9e2ff; }
    .status { gap:5px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🌟 Skip Count Adventure 🌟</h1>
    <p class="subtitle">Jump through the numbers and discover multiplication!</p>
  </header>

  <section class="panel">
    <div class="setup">
      <label for="skip">I want to skip by:</label>
      <select id="skip">
        <option value="1">1</option><option value="2">2</option>
        <option value="3">3</option><option value="4">4</option>
        <option value="5">5</option><option value="6">6</option>
        <option value="7">7</option><option value="8">8</option>
        <option value="9">9</option><option value="10">10</option>
        <option value="11">11</option><option value="12">12</option>
      </select>
      <button class="start" id="startBtn">🚀 Start!</button>
    </div>

    <div class="status">
      <div class="stat">Next number<strong id="next" style="display:none;">—</strong></div>
      <div class="stat">Stars ⭐<strong id="stars">0</strong></div>
      <div class="stat">Progress<strong id="count">0 / 0</strong></div>
    </div>

    <div class="progress-wrap"><div class="progress" id="progress"></div></div>
    <div class="hint" id="hint">Choose a number and press Start!</div>

    <div class="connection" id="connection">
      <div class="equation" id="equation"></div>
      <div class="message" id="message"></div>
    </div>
  </section>

  <section class="panel">
    <div class="board" id="board"></div>
    <div class="legend">
      <span><i class="dot green"></i>Correct!</span>
      <span><i class="dot red"></i>Try again!</span>
    </div>
    <p class="small">Tip: Start with 2, 5 or 10. Then try 3, 4, 6…</p>
  </section>
</div>

<script>
const board = document.getElementById("board");
const skip = document.getElementById("skip");
const startBtn = document.getElementById("startBtn");
const nextEl = document.getElementById("next");
const starsEl = document.getElementById("stars");
const countEl = document.getElementById("count");
const progressEl = document.getElementById("progress");
const hintEl = document.getElementById("hint");
const connection = document.getElementById("connection");
const equation = document.getElementById("equation");
const message = document.getElementById("message");

let step = 1, expected = 0, total = 0, completed = 0, stars = 0, running = false;

function buildBoard() {
  board.innerHTML = "";
  for (let n = 1; n <= 100; n++) {
    const b = document.createElement("button");
    b.className = "num";
    b.textContent = n;
    b.dataset.number = n;
    b.addEventListener("click", () => tapNumber(n, b));
    board.appendChild(b);
  }
}

function startGame() {
  step = Number(skip.value);
  expected = step;
  total = Math.floor(100 / step);
  completed = 0;
  stars = 0;
  running = true;
  starsEl.textContent = stars;
  countEl.textContent = `0 / ${total}`;
  nextEl.textContent = expected;
  progressEl.style.width = "0%";
  connection.classList.remove("show");
  hintEl.textContent = `Find ${expected}! Then jump by ${step}.`;
  document.querySelectorAll(".num").forEach(b => {
    b.className = "num";
    b.disabled = false;
  });
}

function tapNumber(n, button) {
  if (!running) {
    hintEl.textContent = "Choose a skip number and press Start first! 😊";
    return;
  }
  if (n === expected) {
    button.classList.add("correct", "done");
    button.disabled = true;
    completed++;
    stars++;
    starsEl.textContent = stars;
    countEl.textContent = `${completed} / ${total}`;
    progressEl.style.width = `${(completed / total) * 100}%`;

    const multiplier = completed;
    equation.textContent = `${step} × ${multiplier} = ${n}`;
    message.textContent = "🎉 Great jump! This is a multiplication fact.";
    connection.classList.add("show");

    expected += step;

    if (expected <= 100) {
      nextEl.textContent = expected;
      hintEl.textContent = `Fantastic! Now find ${expected}.`;
    } else {
      nextEl.textContent = "🎉";
      hintEl.textContent = `Amazing! You completed the ${step} times table to 100!`;
      running = false;
      setTimeout(() => {
        equation.textContent = `🏆 ${step} × ${total} = ${total * step}`;
        message.textContent = "You finished the whole skip-counting journey!";
      }, 250);
    }
  } else {
    button.classList.remove("wrong");
    void button.offsetWidth;
    button.classList.add("wrong");
    hintEl.textContent = `Oops! We need ${expected} next. Try that number.`;
    setTimeout(() => button.classList.remove("wrong"), 600);
  }
}

startBtn.addEventListener("click", startGame);
buildBoard();
</script>
</body>
</html>
